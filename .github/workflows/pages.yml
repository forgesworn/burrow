name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

# Build and deploy are separate jobs on purpose. GitHub's Pages deployment can
# stall in `deployment_queued` and time out on their side; re-running a single
# combined job then uploads a second `github-pages` artifact into the same run
# and deploy-pages refuses with "Multiple artifacts named github-pages". Split,
# a re-run of the failed deploy job reuses the artifact that already exists.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned for the same reason as ci.yml: strict-action-pins refuses a
      # floating tag. Dependabot keeps these current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
