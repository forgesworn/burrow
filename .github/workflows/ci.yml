name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Re-run without inventing a commit. During the GitHub Actions outage of
  # 2026-08-06 runs were cancelled at the queue timeout with no steps executed,
  # and the only way to retry a green-worthy commit was to push another one.
  workflow_dispatch:
  schedule:
    # A dropped release event leaves no failing run anywhere, so the only thing
    # that notices is something which runs on its own schedule.
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  # v0.16.2 was tagged, released on GitHub, and never reached npm: the release
  # event was dropped and release.yml never ran. No guard inside that workflow
  # can catch its own non-firing, so this one lives outside it and compares
  # what is tagged against what is actually installable.
  published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
      - run: node scripts/check-published.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, latest]
    steps:
      # SHA-pinned: the anvil release workflow runs strict-action-pins and
      # refuses to publish a repo carrying a floating tag. Dependabot keeps
      # the SHAs current; the comment is the only human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
